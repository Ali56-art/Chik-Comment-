<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civciv Komutu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f0f4f8; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-container { width: 100%; max-width: 1100px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; min-height: 85vh; }
        .header { background: #2c3e50; color: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .content-body { display: flex; flex: 1; }
        .sidebar { width: 260px; background: #f8f9fa; border-right: 1px solid #ddd; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .game-area { flex: 1; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .account-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .btn-teacher { background: #27ae60; }
        .btn-creative { background: #e67e22; }
        .btn-student { background: #2980b9; }
        .party-section { display: none; flex-direction: column; gap: 8px; background: #e3f2fd; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .party-btn { width: 100%; padding: 8px; border: none; border-radius: 4px; background: #3498db; color: #fff; font-weight: bold; cursor: pointer; }
        .party-btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        .canvas-box { width: 100%; height: 250px; background: #e8f5e9; border: 2px dashed #81c784; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 2rem; }
        .lobby-panel { display: none; background: #fff; border: 2px solid #3498db; border-radius: 8px; padding: 15px; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <div>
                <span>🐤 Civciv Komutu</span>
                <h2 id="txtTitle">Lobiye Hoş Geldin!</h2>
            </div>
        </div>

        <div class="content-body">
            <div class="sidebar">
                <div>
                    <div style="background:#eef2f7; padding:10px; border-radius:6px; font-size:0.9rem; margin-bottom:10px;">
                        Lütfen civcivi komutlandır! 🐥
                    </div>
                    <div style="font-weight:bold; font-size:0.85rem; margin-bottom:15px;">
                        <div id="lblLevel">Seviye: 1 / 100</div>
                        <div id="lblRole">Oyuncu: Misafir</div>
                    </div>

                    <!-- Parti Alanı (Başta Gizli) -->
                    <div id="partySection" class="party-section">
                        <span style="font-size:0.75rem; font-weight:bold; color:#1565c0; text-align:center;">PARTİ YÖNETİMİ</span>
                        <button id="createPartyBtn" class="party-btn">Parti Oluştur</button>
                        <button id="partyCodeBtn" class="party-btn">Parti Kodu</button>
                        <button id="joinPartyBtn" class="party-btn">Partiye Katıl</button>
                        <button id="startRaceBtn" class="party-btn" style="background:#27ae60; display:none;" disabled>Yarışmayı Başlat (Min 5)</button>
                        <div id="pinDisplay" style="text-align:center; font-weight:bold; font-size:0.85rem; background:#fff; padding:5px; display:none;">PIN: Yok</div>
                    </div>
                </div>

                <div>
                    <button id="teacherBtn" class="account-btn btn-teacher">TEACHER ACCOUNT</button>
                    <button id="creativeBtn" class="account-btn btn-creative">CREATIVE ACCOUNT</button>
                    <button id="studentBtn" class="account-btn btn-student">STUDENT ACCOUNT</button>
                </div>
            </div>

            <div class="game-area">
                <div class="canvas-box" id="canvasBox">🐥 ➡️ 🌾</div>
                
                <div>
                    <h3>Komut Paneli</h3>
                    <div style="margin-top:10px; display:flex; gap:8px;">
                        <button id="runBtn" style="padding:8px 15px; background:#2ecc71; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">Çalıştır ▶️</button>
                    </div>
                </div>

                <div id="lobbyPanel" class="lobby-panel">
                    <h4>Katılan Oyuncular Lobi Paneli</h4>
                    <p style="font-size:0.8rem; color:#666;">Yarışmanın başlaması için en az 5 öğrenci gerekli.</p>
                    <ul id="playerList" style="list-style:none; margin-top:8px;">
                        <li style="color:#888; font-style:italic;">Daha kişi yok</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            updateUI();
            setInterval(updateLobby, 1000);

            // Buton Dinleyicileri
            document.getElementById('teacherBtn').addEventListener('click', handleTeacher);
            document.getElementById('creativeBtn').addEventListener('click', handleCreative);
            document.getElementById('studentBtn').addEventListener('click', handleStudent);
            document.getElementById('createPartyBtn').addEventListener('click', handleCreateParty);
            document.getElementById('partyCodeBtn').addEventListener('click', handlePartyCode);
            document.getElementById('joinPartyBtn').addEventListener('click', handleJoinParty);
            document.getElementById('startRaceBtn').addEventListener('click', handleStartRace);
            document.getElementById('runBtn').addEventListener('click', handleRun);
        });

        function updateUI() {
            const role = localStorage.getItem('userRole');
            const name = localStorage.getItem('playerName');
            const partySec = document.getElementById('partySection');

            if (role) {
                partySec.style.display = 'flex';
                let roleTxt = role === 'teacher' ? 'Öğretmen' : (role === 'creative' ? 'Creative' : 'Öğrenci (' + name + ')');
                document.getElementById('lblRole').innerText = 'Oyuncu: ' + roleTxt;

                if (role === 'student') {
                    document.getElementById('createPartyBtn').style.display = 'none';
                    document.getElementById('startRaceBtn').style.display = 'none';
                } else {
                    document.getElementById('createPartyBtn').style.display = 'block';
                    document.getElementById('startRaceBtn').style.display = 'block';
                }
            } else {
                partySec.style.display = 'none';
            }

            const pin = localStorage.getItem('activePartyPin');
            if (pin) {
                const pinBox = document.getElementById('pinDisplay');
                pinBox.innerText = "PIN: " + pin;
                pinBox.style.display = 'block';
            }

            if (localStorage.getItem('isPartyCreated') === 'true' && role !== 'student') {
                document.getElementById('lobbyPanel').style.display = 'block';
            }
        }

        function updateLobby() {
            if (localStorage.getItem('isPartyCreated') === 'true') {
                const players = JSON.parse(localStorage.getItem('joinedPlayers') || '[]');
                const list = document.getElementById('playerList');
                const startBtn = document.getElementById('startRaceBtn');

                if (players.length > 0) {
                    list.innerHTML = '';
                    players.forEach(p => {
                        const li = document.createElement('li');
                        li.innerText = '👤 ' + p;
                        li.style.cssText = 'background:#f1f8ff; padding:6px; border-radius:4px; margin-bottom:4px; font-weight:bold; color:#27ae60;';
                        list.appendChild(li);
                    });
                } else {
                    list.innerHTML = '<li style="color:#888; font-style:italic;">Daha kişi yok</li>';
                }

                if (players.length >= 5) {
                    startBtn.disabled = false;
                    startBtn.innerText = "Yarışmayı Başlat 🚀";
                } else {
                    startBtn.disabled = true;
                    startBtn.innerText = `Yarışmayı Başlat (${players.length}/5 Öğrenci)`;
                }
            }
        }

        function handleTeacher() {
            const pass = prompt("Öğretmen şifresini girin:");
            if (pass === "teacher§@") {
                localStorage.setItem('userRole', 'teacher');
                alert("Giriş başarılı!");
                location.reload();
            } else if (pass !== null) { alert("Hatalı şifre!"); }
        }

        function handleCreative() {
            const pass = prompt("Creative şifresini girin:");
            if (pass === "creativeOO1029384756") {
                localStorage.setItem('userRole', 'creative');
                alert("Giriş başarılı!");
                location.reload();
            } else if (pass !== null) { alert("Hatalı şifre!"); }
        }

        function handleStudent() {
            const name = prompt("Kullanıcı adınızı girin:");
            if (name && name.trim() !== "") {
                localStorage.setItem('userRole', 'student');
                localStorage.setItem('playerName', name.trim());
                alert("Hoş geldin, " + name);
                location.reload();
            } else if (name !== null) { alert("Geçerli bir ad girmelisin!"); }
        }

        function handleCreateParty() {
            const pin = Math.floor(100000 + Math.random() * 900000).toString();
            localStorage.setItem('activePartyPin', pin);
            localStorage.setItem('isPartyCreated', 'true');
            localStorage.setItem('joinedPlayers', JSON.stringify([]));
            document.getElementById('pinDisplay').innerText = "PIN: " + pin;
            document.getElementById('pinDisplay').style.display = 'block';
            document.getElementById('lobbyPanel').style.display = 'block';
            alert("Parti oluşturuldu! PIN: " + pin);
        }

        function handlePartyCode() {
            const pin = localStorage.getItem('activePartyPin');
            if (pin) alert("Aktif Parti PIN: " + pin);
            else alert("Aktif parti yok!");
        }

        function handleJoinParty() {
            const code = prompt("Parti PIN kodunu girin:");
            const pin = localStorage.getItem('activePartyPin');
            const name = localStorage.getItem('playerName') || 'Öğrenci';
            if (code) {
                if (code === pin) {
                    let players = JSON.parse(localStorage.getItem('joinedPlayers') || '[]');
                    if (!players.includes(name)) {
                        players.push(name);
                        localStorage.setItem('joinedPlayers', JSON.stringify(players));
                    }
                    alert("Partiye katıldın!");
                } else { alert("Geçersiz PIN!"); }
            }
        }

        function handleStartRace() {
            localStorage.setItem('isRaceActive', 'true');
            alert("Yarışma başladı!");
            document.getElementById('lblLevel').innerText = "Seviye: 1 / 10 (YARIŞMA)";
        }

        function handleRun() {
            const isRace = localStorage.getItem('isRaceActive') === 'true';
            let lvl = parseInt(localStorage.getItem('currentLvl') || '1') + 1;
            const limit = isRace ? 10 : 100;

            if (lvl > limit) {
                if (isRace) {
                    alert("🥇 10. seviyeyi bitirdin ve 1. oldun!");
                    lvl = 10;
                } else {
                    alert("🏆 Tebrikler, 100. seviyeyi tamamlayıp Sertifika Kazandın!");
                    lvl = 100;
                }
            }
            localStorage.setItem('currentLvl', lvl);
            document.getElementById('lblLevel').innerText = `Seviye: ${lvl} / ${limit}`;
            alert("Seviye geçildi!");
        }
    </script>
</body>
</html>
