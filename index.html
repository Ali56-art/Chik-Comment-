<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civciv Komutu - Chick Command</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 90vh;
        }

        .header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title span {
            font-size: 1.2rem;
            color: #f1c40f;
        }

        .header-title h2 {
            margin-top: 5px;
            font-size: 1.8rem;
        }

        .lang-switch {
            background: #34495e;
            color: white;
            border: 1px solid #f1c40f;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .content-body {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 280px;
            background-color: #f8f9fa;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 15px;
        }

        .menu-top {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-card {
            background: #eef2f7;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .status-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #555;
        }

        /* Başlangıçta gizli parti alanı */
        .party-section {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #90caf9;
        }

        .party-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .party-btn:hover {
            background-color: #2980b9;
        }

        .party-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .pin-display {
            background: #ffffff;
            border: 1px dashed #3498db;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            font-size: 0.9rem;
            display: none;
        }

        .menu-footer {
            margin-top: auto;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid #dee2e6;
        }

        .account-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .account-btn:hover {
            opacity: 0.9;
        }

        .btn-teacher { background-color: #27ae60; }
        .btn-creative { background-color: #e67e22; }
        .btn-student { background-color: #2980b9; }

        .game-area {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .canvas-container {
            width: 100%;
            height: 320px;
            background-color: #e8f5e9;
            border: 2px dashed #81c784;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .chick-grid {
            display: grid;
            grid-template-columns: repeat(5, 50px);
            grid-template-rows: repeat(5, 50px);
            gap: 4px;
            background: #a5d6a7;
            padding: 6px;
            border-radius: 8px;
        }

        .grid-cell {
            width: 50px;
            height: 50px;
            background: #c8e6c9;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            border-radius: 4px;
        }

        .command-panel {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
        }

        .command-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .cmd-btn {
            padding: 8px 14px;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .command-chain {
            min-height: 45px;
            background: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 6px;
